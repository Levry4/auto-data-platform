services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: auto-data-minio
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: devadmin
      MINIO_ROOT_PASSWORD: LocalDevPassword2026
    volumes:
      - auto-data-minio-data:/data
    restart: unless-stopped

volumes:
  auto-data-minio-data:
